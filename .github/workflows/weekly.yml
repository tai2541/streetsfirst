# Weekly rebuild: fetch fresh city data, score it, check the result, publish to GitHub Pages.
# A failed fetch check, build or page self-test stops the job, and the site keeps the last good version.
# Setup once: repository Settings -> Pages -> Source: "GitHub Actions".
name: Weekly rebuild

# Publishing = pushing to main. Day-to-day work happens on the dev branch, which never publishes; when a batch of
# changes is ready, dev is merged into main and pushed, and this job builds and deploys it.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 10 * * 1'   # Mondays 10:00 UTC (2-3am Pacific): fresh data each week even with no code changes
  workflow_dispatch:        # "Run workflow" button for a manual rebuild
    inputs:
      accept_counts:
        description: 'Accept a big change in a dataset''s row count (skip the 25% check this once)'
        type: boolean
        default: false

# GitHub turns off scheduled workflows after 60 days with no repository activity. The keepalive job below re-enables this
# workflow through the API on every scheduled run, which resets that timer; a failed run opens a GitHub issue (which
# also emails the owner). The site also shows a "data last updated" notice after 14 days.

env:
  SITE_URL: https://streetsfirst.org   # the live site (custom domain on GitHub Pages)

permissions:
  contents: read            # the build job only reads the repo; deploy gets the Pages permissions below

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5
        with:
          persist-credentials: false

      - name: Get DuckDB (pinned)
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force tools\duckdb | Out-Null
          Invoke-WebRequest 'https://github.com/duckdb/duckdb/releases/download/v2.0.0/duckdb-cli-windows-amd64.tar.gz' -OutFile duckdb.tar.gz -UseBasicParsing
          # Refuse a download that doesn't match the pinned release.
          if ((Get-FileHash duckdb.tar.gz -Algorithm SHA256).Hash -ne '91663C2F36C2A334B0E5E639006D8C29C29E013AF0C477D80BB931DF68870312') { throw 'DuckDB download does not match the pinned checksum' }
          tar -xzf duckdb.tar.gz -C tools\duckdb
          if (-not (Test-Path tools\duckdb\duckdb.exe)) { throw 'duckdb.exe not found in the download' }
          & tools\duckdb\duckdb.exe -no-agent -c "install spatial;"
          if ($LASTEXITCODE -ne 0) { throw 'could not install the DuckDB spatial extension' }

      # Last run's row counts, so the fetch can refuse a sudden 25% drop or jump in any dataset. Taken from the live site
      # (published with each build), so they survive however long it's been since the last run.
      - name: Get last row counts from the live site
        if: ${{ !inputs.accept_counts }}
        run: |
          New-Item -ItemType Directory -Force data\raw | Out-Null
          # Seattle's counts; the older top-level address is the fallback for the first run after the move to /seattle/.
          # Without them the 25% check would quietly switch off, so a site that can't be reached stops the run (after a
          # few tries); run the workflow by hand with accept_counts to go ahead without the check.
          $ok = $false
          for ($i = 1; $i -le 4 -and -not $ok; $i++) {
            try { Invoke-WebRequest "$env:SITE_URL/seattle/data/counts.json" -OutFile data\raw\counts.json -UseBasicParsing; $ok = $true; Write-Host 'Got last counts.' }
            catch { Write-Host "Try $i : $($_.Exception.Message)"; if ($i -lt 4) { Start-Sleep -Seconds (30 * $i) } }
          }
          if (-not $ok) { throw 'Could not get last row counts from the live site. Run the workflow with accept_counts to skip the 25% check.' }
      # Last run's map credit lines, so one Esri layer that can't be reached this week keeps last week's wording.
      - name: Get last map credits from the live site
        run: |
          New-Item -ItemType Directory -Force data\raw | Out-Null
          try { Invoke-WebRequest "$env:SITE_URL/seattle/data/basemap_credits.json" -OutFile data\raw\basemap_credits.json -UseBasicParsing; Write-Host 'Got last map credits.' }
          catch { Write-Host "No published map credits yet: $($_.Exception.Message)" }

      - name: Fetch and build
        run: powershell -ExecutionPolicy Bypass -File run.ps1

      - name: Check the built site
        timeout-minutes: 10
        run: powershell -ExecutionPolicy Bypass -File pipeline/check.ps1 -Dir dist/seattle

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa   # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e   # v4

  # Keeps the weekly schedule from being switched off for inactivity (no commits needed).
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/weekly.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}

  # Any failed step (fetch check, build, self-test, deploy): open an issue, or add to the open one, with a link to the run.
  # The site keeps last week's version until a run succeeds.
  alert:
    needs: [build, deploy]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - run: |
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          n=$(gh issue list -R "${{ github.repository }}" --state open --search "Weekly rebuild failed in:title" --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" -R "${{ github.repository }}" --body "Failed again: $url"
          else gh issue create -R "${{ github.repository }}" --title "Weekly rebuild failed" --body "The weekly rebuild failed, so the site still shows last week's data. Run: $url"; fi
        env:
          GH_TOKEN: ${{ github.token }}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seattle Infrastructure Priority Map (v1)</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div>
      <h1>Seattle Infrastructure Priority Map <span class="tag">v1</span></h1>
      <p class="sub">Where Seattle's streets hurt people most, ranked by what to fix first. Pick a spot to see why.
        <span class="sub-not">About fixing streets, not policing.</span></p>
    </div>
    <nav role="tablist" aria-label="Views">
      <button role="tab" id="tabbtn-priorities" data-tab="priorities" aria-controls="tab-priorities" aria-selected="true" class="active">Priorities</button>
      <button role="tab" id="tabbtn-spending" data-tab="spending" aria-controls="tab-spending" aria-selected="false" tabindex="-1">SDOT capital budget</button>
      <button role="tab" id="tabbtn-about" data-tab="about" aria-controls="tab-about" aria-selected="false" tabindex="-1">How it's scored</button>
    </nav>
  </header>

  <main>
    <aside id="panel">
      <section id="tab-priorities" class="tab active" role="tabpanel" aria-labelledby="tabbtn-priorities">
        <div class="searchbox">
          <input id="search" type="search" autocomplete="off" placeholder="Find any street or intersection"
                 aria-label="Find any street or intersection" aria-controls="searchResults" aria-expanded="false">
          <ul id="searchResults" role="listbox" aria-label="Matching locations" hidden></ul>
        </div>
        <div class="controls">
          <label>Ranking
            <select id="mode">
              <option value="ksi">Recommended</option>
              <option value="risk">Risk for its traffic</option>
            </select>
          </label>
          <label>Show top
            <select id="topN"><option>10</option><option>25</option><option selected>50</option><option>100</option><option>200</option></select>
          </label>
        </div>
        <p id="modeHint" class="hint" aria-live="polite"></p>
        <div class="controls">
          <label>Type
            <select id="addrFilter">
              <option value="">All</option><option value="I">Intersections</option><option value="B">Blocks</option>
            </select>
          </label>
          <label class="check"><input type="checkbox" id="onlyFatal"> Has a death</label>
          <label class="check" title="A fatal or serious-injury crash in 3 or more different years"><input type="checkbox" id="onlyOngoing"> Ongoing harm</label>
        </div>
        <ol id="list" aria-label="Ranked locations"></ol>
        <p class="note provenance" id="provenance"></p>
      </section>

      <section id="tab-spending" class="tab" role="tabpanel" aria-labelledby="tabbtn-spending">
        <div id="budget"></div>
      </section>

      <section id="tab-about" class="tab" role="tabpanel" aria-labelledby="tabbtn-about">
        <div id="about"></div>
      </section>
    </aside>

    <div id="detail" role="region" aria-labelledby="detailTitle" hidden>
      <div id="resizeHandle" title="Drag to resize" aria-hidden="true"></div>
      <div class="dtop">
        <h2 id="detailTitle" tabindex="-1"></h2>
        <div class="dbtns">
          <button id="sheetDetail" title="Show more" aria-label="Show more" aria-expanded="false">⌃</button>
          <button id="expandDetail" title="Expand (E)" aria-label="Expand">⤢</button>
          <button id="closeDetail" title="Close (Esc)" aria-label="Close">×</button>
        </div>
      </div>
      <div id="detailBody"></div>
    </div>

    <div id="map" aria-label="Map of ranked locations"></div>
    <div id="mapNote" hidden>The budget isn't on the map: the city's budget data has no locations.</div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="data/data.js"></script>
  <script src="app.js"></script>
</body>
</html>
